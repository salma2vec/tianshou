name: C51 native training validation
on:
  push:
    branches: [codex/validate-c51-training-20261031]
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        algorithm: [c51, rainbow]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest pygame
      - run: |
          mkdir -p validation
          git rev-parse HEAD > validation/head.txt
          python -m pip freeze > validation/dependencies.txt
          sha256sum tianshou/algorithm/modelfree/c51.py test/base/test_c51_targets.py > validation/source.sha256
      - name: Native CartPole training, resume, and prioritized replay
        run: python -m pytest test/discrete/test_${{ matrix.algorithm }}.py -k 'not determinism' -q --junitxml=validation/training.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-training-${{ matrix.algorithm }}
          path: validation
